<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base</title>

    <style>
      body {
        margin: 0;
      }

      .desktop-block-body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        font-family: sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }

      .desktop-block-box {
        background: white;
        padding: 40px;
        border-radius: 14px;
        text-align: center;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .desktop-block-box h1 {
        margin: 10px 0 12px;
        font-size: 24px;
      }

      .desktop-block-box p {
        margin: 0;
        color: #555;
        line-height: 1.6;
      }

      .desktop-block-icon {
        font-size: 48px;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script>
      (function () {
        const ua = navigator.userAgent.toLowerCase();

        const mobileAgents = [
          "android",
          "iphone",
          "ipad",
          "ipod",
          "blackberry",
          "windows phone",
          "opera mini",
          "mobile"
        ];

        const isMobile = mobileAgents.some((agent) => ua.includes(agent));
        window.__BLOCK_MOBILE__ = isMobile;

        if (isMobile) {
          document.body.className = "desktop-block-body";
          document.getElementById("root").innerHTML = `
            <div class="desktop-block-box">
              <div class="desktop-block-icon">💻</div>
              <h1>Desktop Required</h1>
              <p>This website is not available on mobile devices.<br>Please open it on a desktop or laptop browser.</p>
            </div>
          `;
        }
      })();
    </script>

    <script type="module">
      if (!window.__BLOCK_MOBILE__) {
        import("/src/main.jsx");
      }
    </script>
  </body>
</html>
