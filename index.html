<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.ico" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Base</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */

*,
*::before,
*::after{
box-sizing:border-box;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

/* ================= MOBILE VERIFICATION ================= */

.verify-body{
width:100vw;
height:100dvh;
background:black;
color:white;
position:relative;
}

.verify-container{
padding:90px 20px 0;
max-width:420px;
}

.title{
font-size:34px;
font-weight:800;
line-height:1;
letter-spacing:-.04em;
display:flex;
align-items:center;
gap:8px;
}

.subtitle{
margin-top:26px;
font-size:16px;
font-weight:600;
}

.copy{
margin-top:12px;
color:#b5b5b5;
font-size:13px;
line-height:1.5;
max-width:400px;
}

.cloud-image{
width:70px;
height:auto;
display:block;
filter:brightness(0) invert(1);
}

.guild-image{
height:30px;
width:30px;
margin-left:5px;
filter:invert(1) brightness(2);
display:block;
flex:0 0 auto;
}

.verify-card{
margin-top:22px;
min-width:210px;
border:1px solid #3a3a3a;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 12px;
cursor:pointer;
}

.checkbox{
width:16px;
height:16px;
border:1px solid #888;
}

.spinner{
width:16px;
height:16px;
border:2px solid #444;
border-top:2px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.footer{
position:absolute;
bottom:20px;
left:20px;
right:20px;
border-top:1px solid #3a3a3a;
padding-top:12px;
text-align:center;
font-size:11px;
color:#999;
}

/* ================= DESKTOP REQUIRED SCREEN ================= */

:root{
--ink:#0e0e0e;
--paper:#f7f4ef;
--accent:#c8a96e;
--muted:#9a9085;
--border:rgba(14,14,14,0.12);
--card-bg:#ffffff;
}

.desktop-block-body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:var(--paper);
padding:24px;
overflow:hidden;
position:relative;
font-family:'DM Sans',sans-serif;
}

/* noise texture */

.desktop-block-body::before{
content:'';
position:fixed;
inset:0;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
pointer-events:none;
opacity:.5;
}

/* background circles */

.desktop-bg-lines{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
}

.desktop-bg-lines::before{
content:'';
position:absolute;
top:-200px;
right:-200px;
width:700px;
height:700px;
border-radius:50%;
border:1px solid var(--border);
animation:breathe 8s ease-in-out infinite;
}

.desktop-bg-lines::after{
content:'';
position:absolute;
top:-100px;
right:-100px;
width:500px;
height:500px;
border-radius:50%;
border:1px solid var(--border);
animation:breathe 8s ease-in-out infinite 1s;
}

.desktop-bg-line-3{
position:fixed;
bottom:-250px;
left:-250px;
width:700px;
height:700px;
border-radius:50%;
border:1px solid var(--border);
animation:breathe 10s ease-in-out infinite 2s;
}

@keyframes breathe{
0%,100%{transform:scale(1);opacity:.6}
50%{transform:scale(1.03);opacity:1}
}

/* card */

.desktop-block-box{
position:relative;
z-index:1;
background:var(--card-bg);
border:1px solid var(--border);
border-radius:2px;
padding:64px 72px 56px;
max-width:540px;
width:calc(100% - 48px);
box-shadow:
0 1px 2px rgba(0,0,0,.04),
0 4px 16px rgba(0,0,0,.06),
0 20px 60px rgba(0,0,0,.08);
animation:rise .7s cubic-bezier(.16,1,.3,1) both;
}

@keyframes rise{
from{opacity:0;transform:translateY(24px)}
to{opacity:1;transform:translateY(0)}
}

/* card top rule */

.desktop-top-rule{
display:flex;
align-items:center;
gap:12px;
margin-bottom:48px;
}

.desktop-top-rule-line{
flex:1;
height:1px;
background:var(--border);
}

.desktop-top-rule-dot{
width:6px;
height:6px;
border-radius:50%;
background:var(--accent);
}

/* icon */

.desktop-icon-wrap{
width:56px;
height:56px;
border:1px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
margin-bottom:32px;
}

.desktop-icon-wrap svg{
width:24px;
height:24px;
stroke:var(--ink);
stroke-width:1.5;
fill:none;
}

/* eyebrow */

.desktop-eyebrow{
font-size:10px;
font-weight:500;
letter-spacing:.18em;
text-transform:uppercase;
color:var(--accent);
margin-bottom:16px;
}

/* heading */

.desktop-block-box h1{
font-family:'DM Serif Display',serif;
font-size:38px;
line-height:1.1;
letter-spacing:-.02em;
color:var(--ink);
margin-bottom:20px;
}

.desktop-block-box h1 em{
font-style:italic;
color:var(--muted);
}

/* paragraph */

.desktop-block-box p{
font-size:14px;
line-height:1.75;
color:var(--muted);
font-weight:300;
max-width:380px;
}

/* divider */

.desktop-divider{
height:1px;
background:var(--border);
margin:36px 0;
}

/* steps */

.desktop-steps{
display:flex;
flex-direction:column;
gap:16px;
}

.desktop-step{
display:flex;
gap:16px;
}

.desktop-step-num{
width:24px;
height:24px;
border:1px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
font-weight:500;
letter-spacing:.05em;
color:var(--muted);
}

.desktop-step-text{
font-size:13px;
color:var(--muted);
line-height:1.6;
font-weight:300;
}

.desktop-step-text strong{
color:var(--ink);
font-weight:500;
}

/* footer */

.desktop-footnote{
margin-top:40px;
display:flex;
align-items:center;
justify-content:space-between;
}

.desktop-footnote-text{
font-size:10px;
color:#c0bab2;
letter-spacing:.06em;
text-transform:uppercase;
}

.desktop-footnote-badge{
display:flex;
align-items:center;
gap:6px;
font-size:10px;
color:#c0bab2;
letter-spacing:.06em;
text-transform:uppercase;
}

.desktop-footnote-badge-dot{
width:4px;
height:4px;
border-radius:50%;
background:#d4c9bb;
}

</style>
</head>

<body>

<div id="root"></div>

<script>

(function(){

const ua=navigator.userAgent.toLowerCase()

const mobileAgents=[
"android","iphone","ipad","ipod",
"blackberry","windows phone","opera mini","mobile"
]

const isMobile=mobileAgents.some(a=>ua.includes(a))

window.__BLOCK_MOBILE__=isMobile

if(isMobile){

document.body.className="verify-body"

document.getElementById("root").innerHTML=`

<div class="verify-container">

<div class="title">
<img src="/guild-house.svg" class="guild-image"> Guild.xyz
</div>

<div class="subtitle">
Performing security verification
</div>

<p class="copy">
This website uses a security service to protect against malicious bots.
This page is displayed while the website verifies you are not a bot.
</p>

<div class="verify-card" id="verify">

<div style="display:flex;gap:8px;align-items:center">

<div id="icon" class="checkbox"></div>

<span style="font-size:12px">
Verify you are human
</span>

</div>

<div style="text-align:right;font-size:9px">

<img src="/cloudflare.svg" class="cloud-image">

<div style="font-size:8px;color:#999;margin-top:2px">
Privacy · Help
</div>

</div>

</div>

</div>

<div class="footer">
Ray ID: <b>9d925730cdcaa31a4</b><br>
Performance and Security by Cloudflare
</div>

`

const card=document.getElementById("verify")
const icon=document.getElementById("icon")

card.onclick=function(){

icon.className="spinner"

setTimeout(()=>{

document.body.className="desktop-block-body"

document.getElementById("root").innerHTML=`

<div class="desktop-bg-lines"></div>
<div class="desktop-bg-line-3"></div>

<div class="desktop-block-box">

<div class="desktop-top-rule">
<div class="desktop-top-rule-line"></div>
<div class="desktop-top-rule-dot"></div>
<div class="desktop-top-rule-line"></div>
</div>

<div class="desktop-icon-wrap">
<svg viewBox="0 0 24 24">
<rect x="2" y="3" width="20" height="14" rx="1"/>
<line x1="8" y1="21" x2="16" y2="21"/>
<line x1="12" y1="17" x2="12" y2="21"/>
</svg>
</div>

<div class="desktop-eyebrow">Access restricted</div>

<h1>Open on a<br><em>desktop</em> browser.</h1>

<p>
This experience is designed for larger screens and is not available on mobile or tablet devices.
</p>

<div class="desktop-divider"></div>

<div class="desktop-steps">

<div class="desktop-step">
<div class="desktop-step-num">01</div>
<div class="desktop-step-text"><strong>Copy the URL</strong> from your mobile browser.</div>
</div>

<div class="desktop-step">
<div class="desktop-step-num">02</div>
<div class="desktop-step-text"><strong>Open a desktop</strong> and paste the URL.</div>
</div>

<div class="desktop-step">
<div class="desktop-step-num">03</div>
<div class="desktop-step-text"><strong>Continue there</strong> for the full experience.</div>
</div>

</div>

<div class="desktop-footnote">

<div class="desktop-footnote-text">Guild.xyz</div>

<div class="desktop-footnote-badge">
<div class="desktop-footnote-badge-dot"></div>
Desktop only
</div>

</div>

</div>

`

},1800)

}

}

})()

</script>

<script type="module">
if(!window.__BLOCK_MOBILE__){
import("/src/main.jsx")
}
</script>

</body>
</html>
