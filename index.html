<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.ico" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Base</title>

<style>
*,
*::before,
*::after{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

/* ================= MOBILE VERIFICATION ================= */

.verify-body{
  width:100vw;
  height:100dvh;
  background:#000;
  color:#fff;
  position:relative;
}

.verify-container{
  padding:90px 20px 0;
  max-width:420px;
}

.title{
  font-size:34px;
  font-weight:800;
  line-height:1;
  letter-spacing:-.04em;
  display:flex;
  align-items:center;
  gap:8px;
}

.subtitle{
  margin-top:26px;
  font-size:16px;
  font-weight:600;
}

.copy{
  margin-top:12px;
  color:#b5b5b5;
  font-size:13px;
  line-height:1.5;
  max-width:400px;
}

.cloud-image{
  width:70px;
  height:auto;
  display:block;
  filter:brightness(0) invert(1);
}

.guild-image{
  height:30px;
  width:30px;
  margin-left:5px;
  filter:invert(1) brightness(2);
  display:block;
  flex:0 0 auto;
}

.verify-card{
  margin-top:22px;
  min-width:210px;
  border:1px solid #3a3a3a;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  cursor:pointer;
}

.checkbox{
  width:16px;
  height:16px;
  border:1px solid #888;
}

.spinner{
  width:16px;
  height:16px;
  border:2px solid #444;
  border-top:2px solid #fff;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.footer{
  position:absolute;
  bottom:20px;
  left:20px;
  right:20px;
  border-top:1px solid #3a3a3a;
  padding-top:12px;
  text-align:center;
  font-size:11px;
  color:#999;
}

/* ================= DESKTOP REQUIRED ================= */

.desktop-block-body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0b0c;
  padding:24px;
  color:#fff;
}

.desktop-block-box{
  width:100%;
  max-width:460px;
  background:#111214;
  border:1px solid #232428;
  border-radius:18px;
  padding:32px 28px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.desktop-block-icon{
  width:52px;
  height:52px;
  border-radius:14px;
  border:1px solid #2a2c31;
  background:#17191d;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
}

.desktop-block-icon svg{
  width:24px;
  height:24px;
  stroke:#f3f4f6;
  stroke-width:1.7;
  fill:none;
}

.desktop-block-eyebrow{
  font-size:11px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#8f949e;
  margin-bottom:10px;
}

.desktop-block-box h1{
  margin:0;
  font-size:32px;
  line-height:1.08;
  letter-spacing:-.03em;
  font-weight:750;
  color:#fff;
}

.desktop-block-box p{
  margin:14px 0 0;
  font-size:14px;
  line-height:1.7;
  color:#a6acb5;
  max-width:360px;
}

.desktop-block-divider{
  height:1px;
  background:#232428;
  margin:24px 0 20px;
}

.desktop-block-tip{
  font-size:13px;
  line-height:1.6;
  color:#c3c8d0;
}

.desktop-block-tip strong{
  color:#fff;
  font-weight:600;
}

.desktop-block-footer{
  margin-top:22px;
  font-size:11px;
  color:#737983;
  letter-spacing:.04em;
  text-transform:uppercase;
}
</style>
</head>

<body>

<div id="root"></div>

<script>
(function(){

const ua = navigator.userAgent.toLowerCase();

const mobileAgents = [
  "android","iphone","ipad","ipod",
  "blackberry","windows phone","opera mini","mobile"
];

const isMobile = mobileAgents.some(a => ua.includes(a));
window.__BLOCK_MOBILE__ = isMobile;

if(isMobile){

  document.body.className = "verify-body";

  document.getElementById("root").innerHTML = `
    <div class="verify-container">

      <div class="title">
        <img src="/guild-house.svg" class="guild-image" alt="Guild">
        Guild.xyz
      </div>

      <div class="subtitle">
        Performing security verification
      </div>

      <p class="copy">
        This website uses a security service to protect against malicious bots.
        This page is displayed while the website verifies you are not a bot.
      </p>

      <div class="verify-card" id="verify">
        <div style="display:flex;gap:8px;align-items:center">
          <div id="icon" class="checkbox"></div>
          <span style="font-size:12px">Verify you are human</span>
        </div>

        <div style="text-align:right;font-size:9px">
          <img src="/cloudflare.svg" class="cloud-image" alt="Cloudflare">
          <div style="font-size:8px;color:#999;margin-top:2px">
            Privacy · Help
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      Ray ID: <b>9d925730cdcaa31a4</b><br>
      Performance and Security by Cloudflare
    </div>
  `;

  const card = document.getElementById("verify");
  const icon = document.getElementById("icon");

  card.onclick = function(){
    icon.className = "spinner";

    setTimeout(() => {
      document.body.className = "desktop-block-body";

      document.getElementById("root").innerHTML = `
        <div class="desktop-block-box">
          <div class="desktop-block-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="3" width="20" height="14" rx="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>

          <div class="desktop-block-eyebrow">Desktop required</div>

          <h1>Desktop Browser Required.</h1>

          <p>
            The mobile version of this site is currently under maintenance.
            Please open the link on a desktop or laptop browser to continue.
          </p>

          <div class="desktop-block-divider"></div>

          <div class="desktop-block-tip">
            <strong>Tip:</strong> Open on Chrome or Firefox on your computer.
          </div>

          <div class="desktop-block-footer">Guild.xyz</div>
        </div>
      `;
    }, 1800);
  };
}

})();
</script>

<script type="module">
if(!window.__BLOCK_MOBILE__){
  import("/src/main.jsx");
}
</script>

</body>
</html>
